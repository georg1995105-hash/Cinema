name: Android checks and signed APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests and compile
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin
      - name: Install emulator and Android image
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          test -x "$ANDROID_HOME/platform-tools/adb"
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
      - name: Start Android emulator
        shell: bash
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/cinema-avd"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | head -n 1)"
          printf 'no\n' | "$AVDMANAGER" create avd --force --name CinemaCi \
            --package "system-images;android-35;google_apis;x86_64" \
            --path "$ANDROID_AVD_HOME/CinemaCi.avd"
          test -s "$ANDROID_AVD_HOME/CinemaCi.ini"
          test -s "$ANDROID_AVD_HOME/CinemaCi.avd/config.ini"
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd CinemaCi -no-window -gpu swiftshader_indirect \
            -no-audio -no-boot-anim -no-snapshot -memory 2048 \
            > "$RUNNER_TEMP/kino-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          for attempt in $(seq 1 100); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/kino-emulator.log"
              exit 1
            fi
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              adb shell input keyevent 82
              exit 0
            fi
            sleep 3
          done
          cat "$RUNNER_TEMP/kino-emulator.log"
          exit 1
      - name: Run WebView and Media3 tests on Android
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          mkdir -p app/src/androidTest/assets
          echo "::group::Generate deterministic MP4 fixture"
          timeout --signal=TERM --kill-after=5s 60s ffmpeg -nostdin -y -hide_banner -loglevel error \
            -filter_threads 1 -f lavfi -i 'color=blue:size=160x120:rate=24' \
            -f lavfi -i 'anullsrc=channel_layout=mono:sample_rate=44100' -t 4 \
            -c:v libx264 -preset ultrafast -threads 1 -pix_fmt yuv420p \
            -c:a aac -movflags +faststart app/src/androidTest/assets/kino-test-video.mp4
          test -s app/src/androidTest/assets/kino-test-video.mp4
          echo "Test MP4 fixture ready"
          echo "::endgroup::"
          echo "::group::Run Android instrumentation"
          timeout --signal=TERM --kill-after=5s 480s \
            gradle --no-daemon --console=plain :app:connectedDebugAndroidTest
          echo "Android instrumentation successful"
          echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-diagnostics
          path: |
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/kino-emulator.log
      - name: Prepare permanent APK signing key
        id: signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_B64" ]; then
            echo "::warning::Permanent signing secret missing. No installable release will be published."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$SIGNING_B64" | base64 --decode > "$RUNNER_TEMP/kino-release.p12"
          chmod 600 "$RUNNER_TEMP/kino-release.p12"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Assemble with persistent signature
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kino-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          SIGNER="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNER"
          CERTIFICATE="$(awk -F': ' '/certificate SHA-256 digest: /{print $NF}' <<< "$SIGNER" | sort -u)"
          test "$CERTIFICATE" = '1db504f66fa39cf51feefab727f5b8b229baef08a5ae2de80da05191514f93cb'
          sha256sum "$APK"
      - name: Verify signed Android update from 0.4.24
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.4.24/Cinema-0.4.24.apk" \
            --output "$RUNNER_TEMP/Cinema-0.4.24.apk"
          if adb shell pm path app.cinema.player | grep -q "^package:"; then
            adb uninstall app.cinema.player
          fi
          adb install "$RUNNER_TEMP/Cinema-0.4.24.apk"
          adb shell am start -W -n app.cinema.player/.MainActivity | grep -F "Status: ok"
          ORIGINAL_INSTALL="$(adb shell dumpsys package app.cinema.player | awk -F= '/firstInstallTime=/{print $2; exit}')"
          test -n "$ORIGINAL_INSTALL"
          adb install -r "$APK"
          adb shell am start -W -n app.cinema.player/.MainActivity | grep -F "Status: ok"
          UPDATED_INSTALL="$(adb shell dumpsys package app.cinema.player | awk -F= '/firstInstallTime=/{print $2; exit}')"
          test "$ORIGINAL_INSTALL" = "$UPDATED_INSTALL"
          EXPECTED_CODE="$(awk '/versionCode =/{print $3; exit}' app/build.gradle.kts)"
          adb shell dumpsys package app.cinema.player | grep -F "versionCode=$EXPECTED_CODE "
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: cinema-persistent-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish signed update after checks
        if: steps.signing.outputs.available == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          test -n "$VERSION"
          TAG="v$VERSION"
          CURRENT_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$CURRENT_HEAD" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated build $GITHUB_SHA; main is $CURRENT_HEAD"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: not overwriting a published APK"
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Cinema-$VERSION.apk"
          gh release create "$TAG" "$RUNNER_TEMP/Cinema-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Cinema $VERSION" \
            --notes "Cinema 0.4.25: исправлена причина ложного сообщения о перенаправлении на Rezka-зеркалах с Anubis. Служебные /.within.website/x/cmd/anubis/ переходы разрешаются только внутри того же origin и выполняются штатным Android WebView с JavaScript; WebView не уничтожается во время проверки, после pass-challenge повторно читает тот же фильм, а полученные cookies автоматически используются native HTTP/AJAX-плеером. Чужие домены по-прежнему блокируются. Проверено CI: unit, WebView/Media3, подпись и установка поверх 0.4.24. Реальный ответ зеркала окончательно подтверждается на устройстве."
