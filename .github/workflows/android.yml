name: Android checks and signed APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests and compile
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare permanent APK signing key
        id: signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_B64" ]; then
            echo "::warning::Permanent signing secret missing. No installable release will be published."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$SIGNING_B64" | base64 --decode > "$RUNNER_TEMP/kino-release.p12"
          chmod 600 "$RUNNER_TEMP/kino-release.p12"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Assemble with persistent signature
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kino-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: kino-persistent-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish signed update after checks
        if: steps.signing.outputs.available == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          test -n "$VERSION"
          TAG="v$VERSION"
          CURRENT_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$CURRENT_HEAD" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated build $GITHUB_SHA; main is $CURRENT_HEAD"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: not overwriting a published APK"
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Kino-$VERSION.apk"
          gh release create "$TAG" "$RUNNER_TEMP/Kino-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Кино $VERSION" \
            --notes "Cinema $VERSION: поиск по названию и голосом, действительные озвучки без фиктивного пункта, корректные параметры видеозапросов, обработка ответов и ссылок на доступные потоки, описание фильма без рекламы Premium. Доступность конкретного видео зависит от зеркала и прав пользователя. CI проверяет тесты, сборку и подпись; воспроизведение на Android ещё требует проверки."
